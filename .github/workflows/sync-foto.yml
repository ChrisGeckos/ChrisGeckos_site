name: Sincronizza foto

# Si avvia da solo ogni ora e a mano (scheda "Actions" > "Sincronizza foto" > "Run workflow")
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: 'Ricarica e sostituisci TUTTE le foto (da usare se hai sostituito una foto su Drive mantenendo lo stesso file)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: sync-foto
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa librerie
        run: pip install pillow requests

      - name: Scarica, converte e salva le foto
        env:
          FORCE: ${{ inputs.forza && '1' || '0' }}
        run: python scripts/sync_foto.py

      - name: Salva le modifiche nel sito
        id: commit
        run: |
          git config user.name  "ChrisGeckos foto bot"
          git config user.email "actions@users.noreply.github.com"
          git add foto
          if git diff --cached --quiet; then
            echo "Nessuna foto nuova o cambiata."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sincronizza foto esemplari"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un salvataggio fatto da un'automazione non fa partire da solo le altre automazioni (regola di GitHub):
      # per questo la pubblicazione del sito si avvia a mano. Se Pages usa "GitHub Actions" parte static.yml;
      # se usa "Deploy from a branch" si chiede a Pages di ricostruire il sito. Il passaggio che non serve fallisce senza conseguenze.
      - name: Ripubblica il sito
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run static.yml --ref "${{ github.ref_name }}" || echo "static.yml non trovato: Pages probabilmente pubblica dal ramo."
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Ricostruzione da ramo non necessaria."
